fail_fast: true

# contrib/ holds vendored third-party files (PCRE2 testdata at a pinned SHA).
# Pre-commit must NOT touch them — trailing-whitespace and end-of-file-fixer
# silently corrupt the upstream content and break conformance comparison.
# Refresh via contrib/pcre2/FETCH.sh.
exclude: '^contrib/'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/dnephin/pre-commit-golang
  rev: v0.5.1
  hooks:
  - id: go-fmt
    args: [ "-s" ]
  - id: go-imports
  - id: go-mod-tidy
  - id: validate-toml
  # id: go-lint
  # id: go-critic
  # id: go-vet
  # id: go-cyclo
  # args: [-over=15]
  # id: no-go-testing
  # id: golangci-lint
  # id: go-build
  # id: go-unit-tests

- repo: local
  hooks:
  - id: wtf
    name: WTF
    entry: '\b(?i:wtf)\b'
    types: [ go ]
    language: pygrep

  - id: test
    name: test
    pass_filenames: false
    entry: env SKIP_TEST_LINE_MATCH_THINGS=1 go test -failfast
    types: [go]
    language: system
